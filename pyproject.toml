[project]
name = "dgeval"
version = "0.1.0"
description = "Launch-readiness eval harness for Deepgram STT in a high-stakes pharmacy refill use case"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "jiwer>=3.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pandas>=2.2",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgeval"]
