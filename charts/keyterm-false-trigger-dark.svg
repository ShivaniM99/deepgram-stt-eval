<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="A partial keyterm list is worse than no list at all. Drug-name accuracy, by whether the spoken drug was on the boost list. n=376 per arm.">
