<text x="141.3" y="118.8" font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">86.5%</text>
<path d="M171.3,342.0 V130.1 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#d95926"/>
<text x="199.3" y="119.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#ffffff">86.4%</text>
<text x="170.3" y="362.0" font-size="12" text-anchor="middle" fill="#c3c2b7">no keyterm list</text>
