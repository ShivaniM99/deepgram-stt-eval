<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-label="Real speech splits far more than synthetic speech. Share of requests arriving as more than one transcript segment, at endpointing=300 ms.">
<rect width="760" height="450" fill="#1a1a19"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="58" y="34" font-size="19" font-weight="650" fill="#ffffff">Real speech splits far more than synthetic speech</text>
<text x="58" y="56" font-size="13" fill="#c3c2b7">Share of requests arriving as more than one transcript segment, at endpointing=300 ms.</text>
<line x1="58" y1="342.0" x2="732" y2="342.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="346.0" font-size="11" text-anchor="end" fill="#8a8982">0</text>
<line x1="58" y1="292.0" x2="732" y2="292.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="296.0" font-size="11" text-anchor="end" fill="#8a8982">20</text>
<line x1="58" y1="242.0" x2="732" y2="242.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="246.0" font-size="11" text-anchor="end" fill="#8a8982">40</text>
<line x1="58" y1="192.0" x2="732" y2="192.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="196.0" font-size="11" text-anchor="end" fill="#8a8982">60</text>
<line x1="58" y1="142.0" x2="732" y2="142.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="146.0" font-size="11" text-anchor="end" fill="#8a8982">80</text>
<line x1="58" y1="92.0" x2="732" y2="92.0" stroke="#333331" stroke-width="1"/>
<text x="48" y="96.0" font-size="11" text-anchor="end" fill="#8a8982">100</text>
<path d="M166.5,342.0 V251.0 a4,4 0 0 1 4,-4 h112.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#3987e5"/>
<text x="226.5" y="238.0" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">38%</text>
<text x="226.5" y="362.0" font-size="12" text-anchor="middle" fill="#c3c2b7">synthetic voices</text>
<text x="226.5" y="377.0" font-size="12" text-anchor="middle" fill="#c3c2b7">(what most evals use)</text>
<path d="M503.5,342.0 V111.0 a4,4 0 0 1 4,-4 h112.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#d95926"/>
<text x="563.5" y="98.0" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">94%</text>
<text x="563.5" y="362.0" font-size="12" text-anchor="middle" fill="#c3c2b7">a real human voice</text>
<text x="563.5" y="377.0" font-size="12" text-anchor="middle" fill="#c3c2b7">(16 recordings)</text>
<line x1="58" y1="342" x2="732" y2="342" stroke="#8a8982" stroke-width="1"/>
<text x="58" y="421.5" font-size="11.5" fill="#c3c2b7">A split request delivers the drug name first and the prescription number second. Acting on the first half looks</text>
<text x="58" y="436.0" font-size="11.5" fill="#c3c2b7">like acting on a complete request.</text>
</g></svg>