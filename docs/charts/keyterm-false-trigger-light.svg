<text x="58" y="34" font-size="19" font-weight="650" fill="#0b0b0b">Listing some drug names made the unlisted ones worse</text>
<text x="58" y="56" font-size="13" fill="#52514e">How often the medicine name came out right. You can give the system a list of words to listen for.</text>
