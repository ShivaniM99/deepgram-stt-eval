<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Listing some drug names made the unlisted ones worse. How often the medicine name came out right. You can give the system a list of words to listen for.">
<rect width="760" height="500" fill="#fcfcfb"/>
