<text x="48" y="296.0" font-size="11" text-anchor="end" fill="#8a8982">20</text>
<line x1="58" y1="242.0" x2="732" y2="242.0" stroke="#e4e3de" stroke-width="1"/>
<text x="48" y="246.0" font-size="11" text-anchor="end" fill="#8a8982">40</text>
<line x1="58" y1="192.0" x2="732" y2="192.0" stroke="#e4e3de" stroke-width="1"/>
<text x="48" y="196.0" font-size="11" text-anchor="end" fill="#8a8982">60</text>
<line x1="58" y1="142.0" x2="732" y2="142.0" stroke="#e4e3de" stroke-width="1"/>
<text x="48" y="146.0" font-size="11" text-anchor="end" fill="#8a8982">80</text>
<line x1="58" y1="92.0" x2="732" y2="92.0" stroke="#e4e3de" stroke-width="1"/>
<text x="48" y="96.0" font-size="11" text-anchor="end" fill="#8a8982">100</text>
<path d="M113.3,342.0 V129.8 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#2a78d6"/>
<text x="141.3" y="118.8" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">86%</text>
<path d="M171.3,342.0 V130.1 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#e34948"/>
<text x="199.3" y="119.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">86%</text>
<text x="170.3" y="362.0" font-size="12" text-anchor="middle" fill="#52514e">we gave it</text>
<text x="170.3" y="377.0" font-size="12" text-anchor="middle" fill="#52514e">no list</text>
<path d="M338.0,342.0 V117.2 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#2a78d6"/>
<text x="366.0" y="106.2" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">92%</text>
<path d="M396.0,342.0 V110.2 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#e34948"/>
<text x="424.0" y="99.2" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">94%</text>
<text x="395.0" y="362.0" font-size="12" text-anchor="middle" fill="#52514e">we listed</text>
<text x="395.0" y="377.0" font-size="12" text-anchor="middle" fill="#52514e">all 50 medicines</text>
<path d="M562.7,342.0 V113.5 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#2a78d6"/>
<text x="590.7" y="102.5" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">93%</text>
<path d="M620.7,342.0 V157.1 a4,4 0 0 1 4,-4 h48.0 a4,4 0 0 1 4,4 V342.0 Z" fill="#e34948"/>
<text x="648.7" y="146.1" font-size="11.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">76%</text>
<text x="619.7" y="362.0" font-size="12" text-anchor="middle" fill="#52514e">we listed only</text>
<text x="619.7" y="377.0" font-size="12" text-anchor="middle" fill="#52514e">half of them</text>
<line x1="58" y1="342" x2="732" y2="342" stroke="#8a8982" stroke-width="1"/>
<rect x="58" y="395" width="11" height="11" rx="2.5" fill="#2a78d6"/>
<text x="75" y="404" font-size="12" fill="#52514e">medicines we listed</text>
<rect x="205.39999999999998" y="395" width="11" height="11" rx="2.5" fill="#e34948"/>
<text x="222.39999999999998" y="404" font-size="12" fill="#52514e">medicines we left out</text>
<text x="58" y="432.0" font-size="11.5" fill="#d03b3b" font-weight="600">With only half listed, 4.5% of the left-out medicines came back as the name of a DIFFERENT real medicine - the</text>
<text x="58" y="447.5" font-size="11.5" fill="#d03b3b" font-weight="600">one we had listed. With no list at all, that never happened once.</text>
